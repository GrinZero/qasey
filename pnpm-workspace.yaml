packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@datadog/native-appsec': true
  '@datadog/native-iast-taint-tracking': true
  '@datadog/native-metrics': true
  bufferutil: true
  esbuild: true
  prisma: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@mastra/core@1.58.0'
  - '@mastra/mcp@1.16.0'
  - '@mastra/memory@1.26.1'
  - '@mastra/pg@1.20.0'
  - '@mastra/schema-compat@1.3.6'
  - '@mastra/slack@1.6.1'
  - '@mastra/deployer@1.58.0'
  - '@mastra/server@1.58.0'
  - mastra@1.24.0
  - '@trycua/cua-driver-darwin-arm64@0.21.0'
  - '@trycua/cua-driver-darwin-x64@0.21.0'
  - '@trycua/cua-driver-linux-arm64-gnu@0.21.0'
  - '@trycua/cua-driver-linux-x64-gnu@0.21.0'
  - '@trycua/cua-driver-win32-arm64-msvc@0.21.0'
  - '@trycua/cua-driver-win32-x64-msvc@0.21.0'
  - '@trycua/cua-driver@0.21.0'
overrides:
  # Mastra still aliases the affected provider-utils 3.x line for AI SDK v5.
  # The imported runtime surface is locked by dependency-compatibility.test.ts.
  '@mastra/core@1.59.0>@ai-sdk/provider-utils-v5': 'npm:@ai-sdk/provider-utils@4.0.48'
  # Prisma 7.2 remains pinned for API and license-closure stability; these exact
  # vulnerable transitive releases are replaced with their first safe lines.
  '@hono/node-server@1.19.6': '1.19.17'
  'deepmerge-ts@7.1.5': '8.0.2'
  'effect@3.18.4': '3.20.0'
  'esbuild@0.27.7': '0.28.2'
  'hono@4.10.6': '4.13.1'
  'lodash@4.17.21': '4.18.1'
  'valibot@1.2.0': '1.4.2'
patchedDependencies:
  '@mastra/core@1.59.0': patches/@mastra__core@1.59.0.patch
  '@mastra/deployer@1.59.0': patches/@mastra__deployer@1.59.0.patch
  mastra@1.25.0: patches/mastra@1.25.0.patch
