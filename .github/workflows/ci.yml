name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ${{ vars.EMERGENCY_RUNNER || 'ubuntu-24.04-4core' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sh ci/install.sh
        env:
          NPM_PUBLISHER_USR: ${{ secrets.NPM_PUBLISHER_USR }}
          NPM_PUBLISHER_PSW: ${{ secrets.NPM_PUBLISHER_PSW }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
