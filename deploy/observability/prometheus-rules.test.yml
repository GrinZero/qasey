rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  - name: configured worker scrape target becomes unavailable
    interval: 1m
    input_series:
      - series: 'up{job="qasey-worker",instance="worker-a"}'
        values: '1 0+0x5'
      - series: 'qasey_build_info{instance="api-a",role="api",version="v1"}'
        values: '1+0x6'
      - series: 'qasey_deployment_mode_info{instance="api-a",mode="distributed",role="api",version="v1"}'
        values: '1+0x6'
      - series: 'qasey_worker_process_up{instance="worker-a",role="worker",version="v1"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: QaseyScrapeTargetDown
        exp_alerts:
          - exp_labels:
              instance: worker-a
              job: qasey-worker
              severity: critical
            exp_annotations:
              summary: A configured Qasey scrape target is down
              runbook: docs/operations.md#metrics-or-process-missing

  - name: worker metrics vanish while API metrics remain
    interval: 1m
    input_series:
      - series: 'up{job="qasey-api",instance="api-a"}'
        values: '1+0x9'
      - series: 'qasey_build_info{instance="api-a",role="api",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_deployment_mode_info{instance="api-a",mode="distributed",role="api",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_worker_process_up{instance="worker-a",role="worker",version="v1"}'
        values: '1 stale _x8'
    alert_rule_test:
      - eval_time: 8m
        alertname: QaseyWorkerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: All Qasey Worker supervisor metrics are missing
              runbook: docs/operations.md#worker-unavailable

  - name: healthy API and Worker targets stay quiet
    interval: 1m
    input_series:
      - series: 'up{job="qasey-api",instance="api-a"}'
        values: '1+0x9'
      - series: 'up{job="qasey-worker",instance="worker-a"}'
        values: '1+0x9'
      - series: 'qasey_build_info{instance="api-a",role="api",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_deployment_mode_info{instance="api-a",mode="distributed",role="api",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_worker_process_up{instance="worker-a",role="worker",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_worker_ready{instance="worker-a",role="worker",version="v1"}'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: QaseyScrapeTargetDown
        exp_alerts: []
      - eval_time: 8m
        alertname: QaseyWorkerMetricsMissing
        exp_alerts: []

  - name: standalone deployment does not expect a separate Worker target
    interval: 1m
    input_series:
      - series: 'up{job="qasey-api",instance="api-a"}'
        values: '1+0x9'
      - series: 'qasey_build_info{instance="api-a",role="api",version="v1"}'
        values: '1+0x9'
      - series: 'qasey_deployment_mode_info{instance="api-a",mode="standalone",role="api",version="v1"}'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 8m
        alertname: QaseyWorkerMetricsMissing
        exp_alerts: []
