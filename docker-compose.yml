name: qasey

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: qasey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QASEY_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${QASEY_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qasey"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - qasey-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "${QASEY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - qasey-redis:/data

volumes:
  qasey-postgres:
  qasey-redis:
