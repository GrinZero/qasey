services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qasey
      POSTGRES_PASSWORD: qasey
      POSTGRES_DB: qasey
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qasey"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["qasey-postgres:/var/lib/postgresql/data"]

volumes:
  qasey-postgres: {}
